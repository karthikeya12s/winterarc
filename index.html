<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Winter Arc</title>
  <meta name="description" content="Track your Winter Arc challenge: daily habits, workouts, progress and health insights.">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Winter Arc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav" aria-label="Main">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Winter Arc</div>
    <a href="#/today" data-icon="today"><span>Today</span></a>
    <a href="#/focus" data-icon="focus"><span>90:90:1</span></a>
    <a href="#/workouts" data-icon="workouts"><span>Workouts</span></a>
    <a href="#/progress" data-icon="progress"><span>Progress</span></a>
    <a href="#/review" data-icon="review"><span>Review</span></a>
    <a href="#/insights" data-icon="insights"><span>Insights</span></a>
    <a href="#/health" data-icon="health"><span>Health</span></a>
    <a href="#/settings" data-icon="settings"><span>Settings</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <button id="fab" class="fab" aria-label="Log workout"></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="workout-dialog">
    <form method="dialog">
      <h2>Log workout</h2>
      <input type="hidden" name="wid">
      <div class="form-grid">
        <label>Date<input type="date" name="date" required></label>
        <label>Type<input name="type" list="types" placeholder="Strength, Run…" autocomplete="off" required></label>
        <label>Duration <small>min</small><input type="number" name="duration" min="0" inputmode="numeric" required></label>
        <label>Effort <small>RPE 1–10</small><input type="number" name="rpe" min="1" max="10" inputmode="numeric"></label>
        <label>Distance <small>km</small><input type="number" name="distance" min="0" step="0.01" inputmode="decimal"></label>
        <label>Calories <small>kcal</small><input type="number" name="calories" min="0" inputmode="numeric"></label>
      </div>
      <div class="ex-head"><span>Lifts <small>sets × reps × kg</small></span>
        <span class="btn-row"><button type="button" class="btn small ghost" data-copy-last>Copy last</button><button type="button" class="btn small ghost" data-add-ex>+ Exercise</button></span></div>
      <div id="exercises" class="ex-list"></div>
      <label>Notes<textarea name="notes" rows="2" placeholder="How it felt, what to change next time…"></textarea></label>
      <datalist id="types"></datalist>
      <datalist id="exnames"></datalist>
      <div class="btn-row end">
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button class="btn">Save workout</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="confirm">
    <p></p>
    <div class="btn-row end">
      <button type="button" class="btn ghost" data-cancel>Cancel</button>
      <button type="button" class="btn" data-ok>OK</button>
    </div>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/strength.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/health-import.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
