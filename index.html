<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Winter Arc</title>
  <meta name="description" content="Track your Winter Arc challenge: daily habits, workouts, progress and health insights.">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Winter Arc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav" aria-label="Main">
    <div class="brand"><span aria-hidden="true">❄️</span> Winter Arc</div>
    <a href="#/today"><span aria-hidden="true">☀️</span><span>Today</span></a>
    <a href="#/workouts"><span aria-hidden="true">🏋️</span><span>Workouts</span></a>
    <a href="#/progress"><span aria-hidden="true">📈</span><span>Progress</span></a>
    <a href="#/insights"><span aria-hidden="true">💡</span><span>Insights</span></a>
    <a href="#/health"><span aria-hidden="true">❤️</span><span>Health</span></a>
    <a href="#/settings"><span aria-hidden="true">⚙️</span><span>Settings</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <button id="fab" class="fab" aria-label="Log workout">+</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="workout-dialog">
    <form method="dialog">
      <h2>Log workout</h2>
      <input type="hidden" name="wid">
      <div class="form-grid">
        <label>Date<input type="date" name="date" required></label>
        <label>Type<input name="type" list="types" placeholder="Strength, Run…" autocomplete="off" required></label>
        <label>Duration <small>min</small><input type="number" name="duration" min="0" inputmode="numeric" required></label>
        <label>Effort <small>RPE 1–10</small><input type="number" name="rpe" min="1" max="10" inputmode="numeric"></label>
        <label>Distance <small>km</small><input type="number" name="distance" min="0" step="0.01" inputmode="decimal"></label>
        <label>Calories <small>kcal</small><input type="number" name="calories" min="0" inputmode="numeric"></label>
      </div>
      <label>Notes<textarea name="notes" rows="2" placeholder="Lifts, sets × reps, PRs, how it felt…"></textarea></label>
      <datalist id="types"></datalist>
      <div class="btn-row end">
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button class="btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/health-import.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
